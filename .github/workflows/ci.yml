name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  # ── Job 1: Static analysis ─────────────────────────────────────────────────
  lint:
    name: Shell lint (ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Syntax check — setup.sh
        run: bash -n scripts/setup.sh

      - name: Syntax check — verify.sh
        run: bash -n scripts/verify.sh

      - name: ShellCheck — setup.sh
        run: shellcheck --severity=warning scripts/setup.sh

      - name: ShellCheck — verify.sh
        run: shellcheck --severity=warning scripts/verify.sh

  verify:
    name: Integration test (verify.sh)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Install AWS CLI v2
        run: |
          curl -fsSL 'https://awscli.amazonaws.com/v2/install.sh' | bash
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run verify.sh
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh
